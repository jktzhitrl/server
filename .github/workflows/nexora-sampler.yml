name: NEXORA Sampler (macOS + Windows build & tests)

on:
  push:
    paths:
      - "NexoraSampler/**"
      - ".github/workflows/nexora-sampler.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        working-directory: NexoraSampler
    steps:
      - uses: actions/checkout@v4
      - name: Xcode-Version
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app || sudo xcode-select -s /Applications/Xcode_16.app || true
          xcodebuild -version
      - name: Kern-Tests (Audio, Sequencer, Speicher, Export, MIDI)
        run: swift test --package-path Packages/NexoraCore
      - name: Werks-Klänge für die Windows-Version exportieren
        run: swift run -c release --package-path Packages/NexoraCore FactoryExport Windows/resources/factory
      - uses: actions/upload-artifact@v4
        with:
          name: NEXORA-Factory-Sounds
          path: NexoraSampler/Windows/resources/factory
          retention-days: 7
      - name: App bauen (Universal, Release)
        run: |
          xcodebuild -project NexoraSampler.xcodeproj -scheme NexoraSampler -configuration Release \
            -derivedDataPath build/DerivedData -destination 'generic/platform=macOS' \
            ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO build > build.log 2>&1 || true
          echo "---- Compilerfehler ----"
          grep -E "error:" build.log | sort -u | head -n 200 || true
          echo "---- Ende des Build-Logs ----"
          tail -n 40 build.log
          test -d "build/DerivedData/Build/Products/Release/NEXORA Sampler.app"
      - name: App-Bundle prüfen
        run: |
          APP="build/DerivedData/Build/Products/Release/NEXORA Sampler.app"
          lipo -info "$APP/Contents/MacOS/NEXORA Sampler"
          plutil -p "$APP/Contents/Info.plist" | head -40
          codesign -dv "$APP" 2>&1 | head -5
      - name: Screenshots erzeugen
        run: |
          mkdir -p shots
          APP="build/DerivedData/Build/Products/Release/NEXORA Sampler.app"
          "$APP/Contents/MacOS/NEXORA Sampler" --screenshots "$PWD/shots" > app.log 2>&1 &
          PID=$!
          sleep 25
          screencapture -x shots/00-desktop.png || echo "screencapture nicht möglich"
          for i in $(seq 1 240); do kill -0 $PID 2>/dev/null || break; sleep 1; done
          kill $PID 2>/dev/null || true
          cat app.log | tail -n 40
          ls -la shots
      - uses: actions/upload-artifact@v4
        with:
          name: NEXORA-Sampler-Screenshots
          path: NexoraSampler/shots/*.png
          if-no-files-found: warn
      - name: Screenshots ins Repository übernehmen
        if: github.event_name == 'push'
        run: |
          ls shots/*.png >/dev/null 2>&1 || { echo "Keine Screenshots"; exit 0; }
          mkdir -p docs/screenshots
          cp shots/*.png docs/screenshots/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          if git diff --cached --quiet; then echo "Keine Änderungen"; exit 0; fi
          git commit -m "NEXORA Sampler: Screenshots aktualisieren [skip ci]"
          for i in 1 2 3; do
            git pull --rebase origin ${{ github.ref_name }} && git push origin HEAD:${{ github.ref_name }} && break
            sleep 5
          done
      - name: App als Artefakt hochladen
        run: ditto -c -k --keepParent "build/DerivedData/Build/Products/Release/NEXORA Sampler.app" NEXORA-Sampler-macOS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: NEXORA-Sampler-macOS
          path: NexoraSampler/NEXORA-Sampler-macOS.zip

  windows:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
        working-directory: NexoraSampler/Windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: NEXORA-Factory-Sounds
          path: NexoraSampler/Windows/resources/factory
      - name: Abhängigkeiten installieren
        run: npm ci
      - name: Engine-Tests (Audio, Sequencer, Export, Projektformat)
        run: npm test
      - name: Windows-App bauen (Installer + portable EXE)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --win nsis portable --x64 --publish never
      - name: Screenshots unter Windows erzeugen
        run: |
          mkdir -p shots
          SHOTS="$(cygpath -w "$PWD/shots")"
          timeout 180 "dist/win-unpacked/NEXORA Sampler.exe" --screenshots "$SHOTS" || echo "App beendet (Code $?)"
          ls -la shots dist
      - uses: actions/upload-artifact@v4
        with:
          name: NEXORA-Sampler-Windows
          path: |
            NexoraSampler/Windows/dist/*.exe
      - uses: actions/upload-artifact@v4
        with:
          name: NEXORA-Sampler-Windows-Screenshots
          path: NexoraSampler/Windows/shots/*.png
          if-no-files-found: warn
      - name: Screenshots ins Repository übernehmen
        if: github.event_name == 'push'
        run: |
          ls shots/*.png >/dev/null 2>&1 || { echo "Keine Screenshots"; exit 0; }
          mkdir -p ../docs/screenshots/windows
          cp shots/*.png ../docs/screenshots/windows/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ../docs/screenshots/windows
          if git diff --cached --quiet; then echo "Keine Änderungen"; exit 0; fi
          git commit -m "NEXORA Sampler: Windows-Screenshots aktualisieren [skip ci]"
          for i in 1 2 3; do
            git pull --rebase origin ${{ github.ref_name }} && git push origin HEAD:${{ github.ref_name }} && break
            sleep 5
          done
